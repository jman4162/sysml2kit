name: conformance

# Checks that every .sysml file this package's writer emits is accepted by the
# OMG pilot implementation, run out of process (the jar is EPL-2.0 and is
# downloaded at runtime, never committed).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  oracle:
    name: pilot-implementation oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group test
      - run: uv run python tools/conformance/run_oracle.py
