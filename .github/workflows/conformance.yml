name: conformance

# Checks that every .sysml fixture this package's writer emits is accepted by
# the OMG pilot implementation, run out of process via windtrader-java (the
# jar is GPL-3.0 wrapping the EPL-2.0 pilot parser; downloaded at runtime and
# sha256-pinned, never committed).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  oracle:
    name: pilot-implementation oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: tools/conformance/.cache
          key: windtrader-java-0f9eeed46929c41f
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --no-project python tools/conformance/run_oracle.py
